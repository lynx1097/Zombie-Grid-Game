<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TLOUPixelverse</title>
    
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden; 
        }

        #loading-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: absolute;
            z-index: 10;
            transition: opacity 0.5s ease-out;
        }

        h2 {
            margin-bottom: 20px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .progress-container {
            width: 400px;
            height: 24px;
            background-color: #333;
            border: 2px solid #555;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }

        #progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #4CAF50, #81c784);
            transition: width 0.3s ease-out;
        }

        #status-text {
            margin-top: 10px;
            font-size: 14px;
            color: #aaa;
        }
    </style>
</head>
<body>

    <div id="loading-screen">
        <h2>Loading TLOUPixelverse</h2>
        <div class="progress-container">
            <div id="progress-bar"></div>
        </div>
        <p id="status-text">Connecting to server...</p>
    </div>

    <!-- The CheerpJ 4.3 Loader -->
    <script src="https://cjrtnc.leaningtech.com/4.3/loader.js"></script>

    <script>
        function waitForCheerpJ() {
            return new Promise((resolve, reject) => {
                let attempts = 0;
                const checkInterval = setInterval(() => {
                    if (typeof cheerpjInit !== 'undefined') {
                        clearInterval(checkInterval);
                        resolve(); 
                    }
                    attempts++;
                    if (attempts > 150) { 
                        clearInterval(checkInterval);
                        reject(new Error("Network timeout: Could not connect to CDN."));
                    }
                }, 100);
            });
        }

        window.addEventListener('load', async function() {
            // ... (progressBar and simulated progress logic) ...

            try {
                await waitForCheerpJ(); 

                statusText.innerText = "Initializing Java 17 Environment...";
                
                // --- FORCE JAVA 17 HERE ---
                await cheerpjInit({ version: 17 });
                
                progressBar.style.width = '90%';
                
                statusText.innerText = "Preparing Game Canvas...";
                // Resolution of your JavaFX Scene
                cheerpjCreateDisplay(800, 600);
                
                progressBar.style.width = '100%';
                statusText.innerText = "Game Ready!";

                setTimeout(async () => {
                    document.getElementById('loading-screen').style.display = 'none';

                    // --- CLEAN PATH (Single slash only) ---
                    await cheerpjRunJar("/app/Zombie-Grid-Game/TLOUP.jar"); 
                }, 500);

            } catch (error) {
                // ... (error handling) ...
            }
        });    
    </script>

</body>
</html>
