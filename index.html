<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TLOUPixelverse</title>
    
    <!-- Safely silences the favicon error without breaking the page -->
    <link rel="icon" href="data:,">
    
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden; 
        }

        #loading-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: absolute;
            z-index: 10;
            transition: opacity 0.5s ease-out;
        }

        h2 {
            margin-bottom: 20px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .progress-container {
            width: 400px;
            height: 24px;
            background-color: #333;
            border: 2px solid #555;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }

        #progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #4CAF50, #81c784);
            transition: width 0.3s ease-out;
        }

        #status-text {
            margin-top: 10px;
            font-size: 14px;
            color: #aaa;
        }
    </style>
</head>
<body>

    <div id="loading-screen">
        <h2>Loading TLOUPixelverse</h2>
        <div class="progress-container">
            <div id="progress-bar"></div>
        </div>
        <p id="status-text">Connecting to server...</p>
    </div>

    <!-- The CheerpJ Engine -->
    <script src="https://cjrtnc.leaningtech.com/4.3/loader.js"></script>

    <script>
        // Gatekeeper to ensure CheerpJ is fully downloaded before we ask it to do anything
        function waitForCheerpJ() {
            return new Promise((resolve, reject) => {
                let attempts = 0;
                const checkInterval = setInterval(() => {
                    if (typeof cheerpjInit !== 'undefined') {
                        clearInterval(checkInterval);
                        resolve(); 
                    }
                    attempts++;
                    if (attempts > 150) { 
                        clearInterval(checkInterval);
                        reject(new Error("Network timeout: Could not connect to CDN."));
                    }
                }, 100);
            });
        }

        // Only run this logic after the HTML body is fully drawn
        window.addEventListener('load', async function() {
            const progressBar = document.getElementById('progress-bar');
            const statusText = document.getElementById('status-text');
            const loadingScreen = document.getElementById('loading-screen');

            // Fake animation to give the user visual feedback during heavy downloads
            let simulatedProgress = 0;
            const progressInterval = setInterval(() => {
                if (simulatedProgress < 85) {
                    simulatedProgress += Math.random() * 5; 
                    if (simulatedProgress > 85) simulatedProgress = 85;
                    progressBar.style.width = simulatedProgress + '%';
                }
            }, 300);

            try {
                statusText.innerText = "Downloading WebAssembly Engine...";
                await waitForCheerpJ(); 

                statusText.innerText = "Initializing Java 17 Environment...";
                // Boot CheerpJ explicitly in Java 17 mode
                await cheerpjInit({ version: 17 });
                
                progressBar.style.width = '90%';
                statusText.innerText = "Preparing Game Canvas...";
                
                // Create the display (Modify 800, 600 if your game window is a different size)
                cheerpjCreateDisplay(800, 600);
                progressBar.style.width = '95%';
                
                clearInterval(progressInterval); 
                progressBar.style.width = '100%';
                statusText.innerText = "Game Ready!";

                setTimeout(async () => {
                    // Fade out the loading UI
                    loadingScreen.style.opacity = '0'; 
                    setTimeout(() => { loadingScreen.style.display = 'none'; }, 500);

                    // Launch the JAR using the strictly cleaned GitHub Pages path
                    await cheerpjRunJar("/app/Zombie-Grid-Game/TLOUP.jar"); 
                }, 500);

            } catch (error) {
                // If anything goes wrong, turn the bar red and log the exact error
                clearInterval(progressInterval);
                console.error("Game crashed or failed to load:", error);
                
                progressBar.style.background = "#ff5252"; 
                statusText.style.color = "#ff5252";
                statusText.innerText = error.message || "Error loading game. Check Console (F12).";
            }
        });
    </script>

</body>
</html>
